# Serves the React build and forwards /api to the Spring Boot container.
upstream tic_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;     # photo / evidence uploads
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API -> backend
    location /api/ {
        proxy_pass http://tic_backend;
        proxy_http_version 1.1;
        # $http_host keeps the port (e.g. SERVER_IP:8080) so Spring sees the same origin
        # as the browser; with plain $host, logins fail CORS on non-80 ports.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Container healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change -> cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # (add_header in a location replaces the server-level ones, so repeat them)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Single-page app: unknown paths (/login, /dashboard, ...) load index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
